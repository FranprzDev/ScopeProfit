name: Backend CI
on:
  pull_request:
    paths: ['apps/api/**', 'packages/contracts/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'docker-compose*.yml', 'scripts/**', '.github/workflows/backend-ci.yml', '.dockerignore']
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/contracts/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'docker-compose*.yml', 'scripts/**', '.github/workflows/backend-ci.yml', '.dockerignore']
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scopeprofit
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: scopeprofit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scopeprofit -d scopeprofit_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://scopeprofit:test-only-password@localhost:5432/scopeprofit_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scopeprofit/contracts run build
      - run: pnpm run db:migrate
      - run: pnpm --filter @scopeprofit/api run lint
      - run: pnpm --filter @scopeprofit/api run typecheck
      - run: pnpm --filter @scopeprofit/api run test:unit
      - run: pnpm --filter @scopeprofit/api run test:integration
      - run: pnpm --filter @scopeprofit/api run test:e2e
      - run: pnpm --filter @scopeprofit/api run build
      - run: pnpm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: backend-production
          path: |
            apps/api/dist
            apps/api/prisma
          retention-days: 7
