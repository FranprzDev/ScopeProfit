name: Backend CI
on:
  pull_request:
    paths: ['apps/api/**', '.github/workflows/backend-ci.yml', 'docker-compose.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/backend-ci.yml', 'docker-compose.yml']
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/api
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scopeprofit
          POSTGRES_PASSWORD: scopeprofit
          POSTGRES_DB: scopeprofit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scopeprofit -d scopeprofit_test" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://scopeprofit:scopeprofit@localhost:5432/scopeprofit_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t scopeprofit-api apps/api
