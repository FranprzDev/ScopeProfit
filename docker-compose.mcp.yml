services:
  caddy:
    image: caddy:2-alpine
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN to the API hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    environment:
      TRUST_PROXY_HOPS: 1
volumes:
  caddy_data:
  caddy_config:
