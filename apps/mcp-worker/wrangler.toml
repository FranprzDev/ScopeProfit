name = "scopeprofit-mcp"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

# Secrets (wrangler secret put): DATABASE_URL, ENCRYPTION_KEY, BREVO_API_KEY (optional until Brevo exists)
# process.env is populated from bindings by nodejs_compat_populate_process_env.

[vars]
PUBLIC_API_URL = "https://scopeprofit-mcp.franutn23.workers.dev"
WEB_URL = "https://scopeprofit.vercel.app"
MCP_RATE_LIMIT_PER_MINUTE = "120"

# R2 binding for when the account enables R2 (checkout requires a payment method).
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "scopeprofit-storage"
[[kv_namespaces]]
binding = "STORAGE_KV"
id = "6089e2027cfa479fb0cae213f96f6538"

[observability]
enabled = true

rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"] }
]
