[project]
name = "scopeprofit-api"
version = "2.0.0"
description = "ScopeProfit backend: messy client idea -> versioned scope brief -> template 7.1 document, exposed over MCP, REST and Telegram."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "httpx>=0.28",
  "mcp>=2.3,<3",
  "reportlab>=5.0",
  "python-docx>=1.2",
  "pillow>=12.3",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
]

[project.scripts]
scopeprofit = "scopeprofit.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "mypy>=1.18",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeprofit"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "ANN"]
ignore = ["S101", "ANN401", "RUF001"]  # en dashes are part of the Spanish template text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "ANN"]
"migrations/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["scopeprofit"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:scopeprofit.*"]

[tool.coverage.run]
source = ["scopeprofit"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.vercel.scripts]
build = "python vercel_build.py"
