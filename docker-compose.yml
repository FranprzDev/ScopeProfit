# Self-hosted alternative to Vercel: PostgreSQL with daily backups, the API and the landing.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scopeprofit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scopeprofit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backup:
    image: prodrigestivill/postgres-backup-local:17
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-scopeprofit}
      POSTGRES_USER: ${POSTGRES_USER:-scopeprofit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  migrate:
    build: apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scopeprofit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scopeprofit}
    command: [scopeprofit, db, upgrade]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    build: apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scopeprofit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scopeprofit}
      DATABASE_POOL: queue
      AGENT_MODE: worker
    ports: ['127.0.0.1:${API_PORT:-3001}:3001']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ['127.0.0.1:${LANDING_PORT:-3000}:3000']
    restart: unless-stopped
volumes:
  postgres_data:
